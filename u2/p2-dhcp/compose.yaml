name: practica-02-dhcp

services:
  dns:
    image: ubuntu/bind9:latest
    container_name: dns
    hostname: ns1
    networks:
      red_practica2:
        ipv4_address: ${DNS_IP}
    volumes:
      - ./bind/named.conf.local:/etc/bind/named.conf.local:ro
      - ./bind/db.${DOMINIO}:/etc/bind/db.${DOMINIO}:ro
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    restart: unless-stopped

  dhcp:
    image: networkboot/dhcpd:latest
    container_name: dhcp
    hostname: dhcp
    networks:
      red_practica2:
        ipv4_address: ${DHCP_IP}
    volumes:
      - ./dhcpd.conf:/data/dhcpd.conf:ro
    restart: unless-stopped

  pc1:
    build:
      context: .
      dockerfile: Dockerfile.pc
      args:
        PC_ROOT_PASSWORD: ${PC_ROOT_PASSWORD}
    image: pc-ssh-dhcp:latest
    container_name: pc1
    hostname: pc1
    networks:
      - red_practica2
    ports:
      - "${SSH_PC1_PORT}:22"
    cap_add:
      - NET_ADMIN
    depends_on:
      - dhcp
      - dns
    restart: unless-stopped

  pc2:
    build:
      context: .
      dockerfile: Dockerfile.pc
      args:
        PC_ROOT_PASSWORD: ${PC_ROOT_PASSWORD}
    image: pc-ssh-dhcp:latest
    container_name: pc2
    hostname: pc2
    networks:
      - red_practica2
    ports:
      - "${SSH_PC2_PORT}:22"
    cap_add:
      - NET_ADMIN
    depends_on:
      - dhcp
      - dns
    restart: unless-stopped

networks:
  red_practica2:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBRED}
