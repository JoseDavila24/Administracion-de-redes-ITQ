name: practica-dns

services:
  dns:
    image: ubuntu/bind9:latest
    container_name: dns
    hostname: ns1
    ports:
      - "${DNS_PORT}:53/udp"
      - "${DNS_PORT}:53/tcp"
    volumes:
      - ./bind/named.conf.local:/etc/bind/named.conf.local:ro
      - ./bind/db.${DOMINIO}:/etc/bind/db.${DOMINIO}:ro
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: web
    hostname: web
    ports:
      - "${HTTP_PORT}:80"
    restart: unless-stopped

  pc1:
    build:
      context: .
      dockerfile: Dockerfile.pc
      args:
        PC_ROOT_PASSWORD: ${PC_ROOT_PASSWORD}
    image: pc-ssh:latest
    container_name: pc1
    hostname: pc1
    ports:
      - "${SSH_PC1_PORT}:22"
    restart: unless-stopped

  pc2:
    build:
      context: .
      dockerfile: Dockerfile.pc
      args:
        PC_ROOT_PASSWORD: ${PC_ROOT_PASSWORD}
    image: pc-ssh:latest
    container_name: pc2
    hostname: pc2
    ports:
      - "${SSH_PC2_PORT}:22"
    restart: unless-stopped
